[package]
name = "dock-audit-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "UI-independent domain and platform-adapter contracts for Dock Audit"

[lib]
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "=0.38.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
