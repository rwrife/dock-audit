[package]
name = "dock-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Local-first desktop utility for auditing dock peripherals"

[lib]
name = "dock_audit_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "dock-audit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
dock-audit-core = { path = "../crates/dock-audit-core" }
tauri = { version = "=2.11.5", features = [] }
